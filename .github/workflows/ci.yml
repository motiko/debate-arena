name: CI

# Pushes to main were checked locally before the push (`pnpm ship`) and deploy without waiting for CI: here they get
# only the fast checks, as a safety net that reports a failure. Pull requests (big changes) and a weekly run also get
# the web quality bar, whose Lighthouse run is too slow to hold up every small change.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The checks only read the code; the token can do nothing else.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # The web quality bar (ADR 0004): Playwright + axe and Lighthouse on a mobile device over slow 4G.
  web:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @debate-arena/web exec playwright install --with-deps chromium
      - run: pnpm --filter @debate-arena/web build
      - run: pnpm --filter @debate-arena/web e2e
      - run: pnpm --filter @debate-arena/web lighthouse
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-reports
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/.lighthouseci
          retention-days: 7
