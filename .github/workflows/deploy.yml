name: Deploy production

# Merging to main deploys production (ADR 0006: no staging), after CI has passed on that commit.
# Off until the repository variable DEPLOY_PRODUCTION is "true" (see DEPLOY.md).
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  newest:
    # `branches: [main]` matches the branch *name* only, which a fork's pull request can also have. Deploy only CI
    # runs started by a push to main of this repository, or a manual run on main.
    if: >-
      vars.DEPLOY_PRODUCTION == 'true' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    outputs:
      newest: ${{ steps.tip.outputs.newest }}
    steps:
      # CI runs can finish out of order; an older commit must never deploy over a newer one (its migrations already ran).
      - id: tip
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tip=$(git ls-remote "https://github.com/$REPOSITORY" refs/heads/main | cut -f1)
          if [ "$tip" = "$HEAD_SHA" ]; then echo "newest=true" >> "$GITHUB_OUTPUT"; else echo "::notice::$HEAD_SHA is not the tip of main ($tip); skipping"; fi

  deploy:
    needs: newest
    if: needs.newest.outputs.newest == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Actions pinned to commit SHAs: this job holds production credentials.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The commit CI passed on (a push to main, checked above), or main for a manual run.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Refuses to deploy while REPLACE_ME placeholders remain (operator details, D1 id, production URL).
      - run: node scripts/check-release.mjs
      # Order matters: schema first, then the API (the web Worker's service binding needs it), then the web.
      # Cloudflare credentials are given only to the steps that run wrangler.
      - run: pnpm exec wrangler d1 migrations apply DB --remote --env production
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm exec wrangler deploy --env production
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The Astro adapter picks the environment at build time; the build's config is then deployed as is.
      - run: pnpm build
        working-directory: apps/web
        env:
          CLOUDFLARE_ENV: production
      - run: pnpm exec wrangler deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
