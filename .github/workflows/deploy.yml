name: Deploy production

# A push to main deploys production at once (ADR 0006: no staging). The checks ran before the push (`pnpm ship` and
# the pre-push hook); CI runs alongside as a safety net and does not hold the deploy up.
# Off until the repository variable DEPLOY_PRODUCTION is "true" (see DEPLOY.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  newest:
    # Only main of this repository: a push there, or a manual run on it.
    if: vars.DEPLOY_PRODUCTION == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      newest: ${{ steps.tip.outputs.newest }}
    steps:
      # Deploys queue one behind another; an older commit must never deploy over a newer one (its migrations already ran).
      - id: tip
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          # The job's token (contents: read) keeps the call off the unauthenticated API rate limit.
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          # An unreadable tip is an error, not "older commit": never skip a deploy silently.
          if [ -z "$tip" ]; then echo "::error::could not read the tip of main"; exit 1; fi
          if [ "$tip" = "$HEAD_SHA" ]; then echo "newest=true" >> "$GITHUB_OUTPUT"; else echo "::notice::$HEAD_SHA is not the tip of main ($tip); skipping"; fi

  deploy:
    needs: newest
    if: needs.newest.outputs.newest == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Actions pinned to commit SHAs: this job holds production credentials.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The commit pushed to main (the tip, checked above).
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Refuses to deploy while REPLACE_ME placeholders remain (operator details, D1 id, production URL).
      - run: node scripts/check-release.mjs
      # Order matters: schema first, then the API (the web Worker's service binding needs it), then the web.
      # Cloudflare credentials are given only to the steps that run wrangler.
      - run: pnpm exec wrangler d1 migrations apply DB --remote --env production
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm exec wrangler deploy --env production
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The Astro adapter picks the environment at build time; the build's config is then deployed as is.
      - run: pnpm build
        working-directory: apps/web
        env:
          CLOUDFLARE_ENV: production
      - run: pnpm exec wrangler deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
