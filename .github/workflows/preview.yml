name: Preview

# Every pull request gets its own isolated preview (ADR 0006): its own Workers, EU D1 database and queues, with fake
# models and dev sign-in on throwaway data, deleted when the PR closes. Only for branches of this repository (secrets
# are not given to forks). Off until the repository variable PREVIEWS is "true" (see DEPLOY.md).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: vars.PREVIEWS == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Deploy the preview
        if: github.event.action != 'closed'
        run: |
          node scripts/preview.mjs up "$PR_NUMBER" | tee preview.log
          url=$(grep -o 'PREVIEW_URL=.*' preview.log | cut -d= -f2-)
          body="Preview: $url (fake models; sign in as any Member with the \`x-dev-member\` header). Deleted when this PR closes."
          gh pr comment "$PR_NUMBER" --edit-last --body "$body" || gh pr comment "$PR_NUMBER" --body "$body"

      - name: Delete the preview
        if: github.event.action == 'closed'
        run: node scripts/preview.mjs down "$PR_NUMBER"
