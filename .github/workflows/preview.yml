name: Preview

# Every pull request gets its own isolated preview (ADR 0006): its own Workers, EU D1 database and queues, with fake
# models and dev sign-in on throwaway data, deleted when the PR closes. Only for branches of this repository: their
# authors can already push here, and secrets are never given to forks. Off until the repository variable PREVIEWS is
# "true" (see DEPLOY.md).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: vars.PREVIEWS == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Actions pinned to commit SHAs: this job holds Cloudflare credentials.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Deploy the preview
        if: github.event.action != 'closed'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
        run: |
          node scripts/preview.mjs up "$PR_NUMBER" | tee preview.log
          grep -o 'PREVIEW_URL=.*' preview.log | cut -d= -f2- > preview-url.txt

      - name: Comment the preview URL
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="Preview: $(cat preview-url.txt) (fake models; sign in as any Member with the \`x-dev-member\` header). Deleted when this PR closes."
          gh pr comment "$PR_NUMBER" --edit-last --body "$body" || gh pr comment "$PR_NUMBER" --body "$body"

      - name: Delete the preview
        if: github.event.action == 'closed'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/preview.mjs down "$PR_NUMBER"
